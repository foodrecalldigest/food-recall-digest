<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120"><title>(for green backgrounds: lime lid) Pip, holding a heart (Ko-fi, thank-yous, milestones)</title><style>
.p{transform-box:view-box}
.body{transform-origin:60px 104px;animation:sway 7.3s cubic-bezier(.45,.05,.35,1) infinite}
.eyes{transform-origin:60px 46px;animation:blink 5.7s ease-in-out infinite}
@keyframes sway{0%,30%,100%{transform:rotate(0)}9%{transform:rotate(-2deg)}19%{transform:rotate(1.4deg)}}
@keyframes blink{0%,91%,100%{transform:scaleY(1)}94%{transform:scaleY(.12)}97%{transform:scaleY(1)}}

.heart{transform-origin:60px 78px;animation:beat 2.6s ease-in-out infinite}
.mini{transform-origin:101px 32px;animation:float 4.3s ease-in-out infinite}
@keyframes beat{0%,40%,100%{transform:scale(1)}8%{transform:scale(1.13)}15%{transform:scale(1)}22%{transform:scale(1.08)}30%{transform:scale(1)}}
@keyframes float{0%{transform:translate(0,4px) scale(.8);opacity:0}20%{opacity:1}70%{transform:translate(2px,-6px) scale(1);opacity:1}100%{transform:translate(3px,-10px) scale(1);opacity:0}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><g class="p body"><rect x="38" y="16" width="44" height="14" rx="4" fill="#D4F25C" stroke="#0E1A14" stroke-width="3"/><rect x="30" y="28" width="60" height="72" rx="22" fill="#FFFFFF" stroke="#0E1A14" stroke-width="4"/><rect x="32" y="62" width="56" height="20" fill="#D4F25C"/><path d="M45 47 Q50 41 55 47 M65 47 Q70 41 75 47" fill="none" stroke="#0E1A14" stroke-linecap="round" stroke-linejoin="round" stroke-width="3.5"/><path d="M52 53 Q60 60 68 53" fill="none" stroke="#0E1A14" stroke-linecap="round" stroke-linejoin="round" stroke-width="3.5"/><path d="M30 70 Q37 82 47 78" fill="none" stroke="#0E1A14" stroke-linecap="round" stroke-linejoin="round" stroke-width="4"/><path d="M90 70 Q83 82 73 78" fill="none" stroke="#0E1A14" stroke-linecap="round" stroke-linejoin="round" stroke-width="4"/><g class="p heart"><path d="M60 89 C48 81 44 75 47 70 C50 65 57 66 60 71 C63 66 70 65 73 70 C76 75 72 81 60 89 Z" fill="#0B5D3B" stroke="#0E1A14" stroke-width="3"/></g><g class="p mini"><path d="M101 37 C95 33 94 30 95.5 28 C97 26 100 26.5 101 29 C102 26.5 105 26 106.5 28 C108 30 107 33 101 37 Z" fill="#FFFFFF" stroke="#0E1A14" stroke-width="2.2"/></g></g></svg>