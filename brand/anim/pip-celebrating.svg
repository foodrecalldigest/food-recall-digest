<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120"><title>(green and lime colors) Pip, celebrating with confetti (subscriber milestones, birthdays of the digest)</title><style>
.p{transform-box:view-box}
.body{transform-origin:60px 104px;animation:sway 7.3s cubic-bezier(.45,.05,.35,1) infinite}
.eyes{transform-origin:60px 46px;animation:blink 5.7s ease-in-out infinite}
@keyframes sway{0%,30%,100%{transform:rotate(0)}9%{transform:rotate(-2deg)}19%{transform:rotate(1.4deg)}}
@keyframes blink{0%,91%,100%{transform:scaleY(1)}94%{transform:scaleY(.12)}97%{transform:scaleY(1)}}

.body{animation:hop 3.9s cubic-bezier(.45,.05,.35,1) infinite}
.armL{transform-origin:30px 66px;animation:cheerL 3.9s cubic-bezier(.45,.05,.35,1) infinite}
.armR{transform-origin:90px 66px;animation:cheerR 3.9s cubic-bezier(.45,.05,.35,1) infinite}
.conf{animation:twinkle 2.7s ease-in-out infinite}
.conf2{animation:twinkle 2.7s ease-in-out 1.3s infinite}
@keyframes hop{0%,36%,100%{transform:translate(0,0)}9%,25%{transform:translate(0,-4px)}17%{transform:translate(0,0)}}
@keyframes cheerL{0%,36%,100%{transform:rotate(0)}9%,25%{transform:rotate(-10deg)}}
@keyframes cheerR{0%,36%,100%{transform:rotate(0)}9%,25%{transform:rotate(10deg)}}
@keyframes twinkle{0%,100%{opacity:1;transform:translate(0,0)}50%{opacity:.35;transform:translate(0,2px)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><g class="p body"><rect x="38" y="16" width="44" height="14" rx="4" fill="#0B5D3B"/><rect x="30" y="28" width="60" height="72" rx="22" fill="#FFFFFF" stroke="#0E1A14" stroke-width="4"/><rect x="32" y="62" width="56" height="20" fill="#D4F25C"/><g fill="#0E1A14"><rect x="41" y="66" width="2.5" height="12"/><rect x="45.5" y="66" width="1.5" height="12"/><rect x="49" y="66" width="3" height="12"/><rect x="54" y="66" width="1.5" height="12"/><rect x="57.5" y="66" width="2.5" height="12"/></g><path d="M45 47 Q50 41 55 47 M65 47 Q70 41 75 47" fill="none" stroke="#0E1A14" stroke-linecap="round" stroke-linejoin="round" stroke-width="3.5"/><path d="M50 52 Q60 65 70 52 Z" fill="#0E1A14" stroke="#0E1A14" stroke-width="2.5" stroke-linejoin="round"/><g class="p armL"><path d="M30 66 Q18 56 20 42" fill="none" stroke="#0E1A14" stroke-linecap="round" stroke-linejoin="round" stroke-width="4"/><circle cx="20" cy="39" r="4.5" fill="#FFFFFF" stroke="#0E1A14" stroke-width="3.5"/></g><g class="p armR"><path d="M90 66 Q102 56 100 42" fill="none" stroke="#0E1A14" stroke-linecap="round" stroke-linejoin="round" stroke-width="4"/><circle cx="100" cy="39" r="4.5" fill="#FFFFFF" stroke="#0E1A14" stroke-width="3.5"/></g><g class="p conf"><rect x="8" y="22" width="6" height="3.5" rx="1" fill="#0B5D3B" transform="rotate(-25 11 24)"/><circle cx="28" cy="12" r="2.4" fill="#0E1A14"/><rect x="12" y="52" width="5" height="3" rx="1" fill="#0E1A14" transform="rotate(20 14 53)"/></g><g class="p conf2"><rect x="104" y="20" width="6" height="3.5" rx="1" fill="#0E1A14" transform="rotate(30 107 22)"/><circle cx="94" cy="9" r="2.6" fill="#0B5D3B"/><circle cx="110" cy="54" r="2.6" fill="#FFFFFF" stroke="#0E1A14" stroke-width="1.8"/></g></g></svg>