<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120"><title>(for green backgrounds: lime lid) Pip, waving (follow / subscribe slides)</title><style>
.p{transform-box:view-box}
.body{transform-origin:60px 104px;animation:sway 7.3s cubic-bezier(.45,.05,.35,1) infinite}
.eyes{transform-origin:60px 46px;animation:blink 5.7s ease-in-out infinite}
@keyframes sway{0%,30%,100%{transform:rotate(0)}9%{transform:rotate(-2deg)}19%{transform:rotate(1.4deg)}}
@keyframes blink{0%,91%,100%{transform:scaleY(1)}94%{transform:scaleY(.12)}97%{transform:scaleY(1)}}

.wave{transform-origin:30px 66px;animation:wave 5.1s cubic-bezier(.45,.05,.35,1) infinite}
.mlines{animation:lines 5.1s ease-in-out infinite}
@keyframes wave{0%,34%,100%{transform:rotate(0)}5%{transform:rotate(-16deg)}11%{transform:rotate(9deg)}17%{transform:rotate(-13deg)}23%{transform:rotate(7deg)}29%{transform:rotate(-4deg)}}
@keyframes lines{0%,34%,100%{opacity:.55}11%,23%{opacity:1}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><g class="p body"><rect x="38" y="16" width="44" height="14" rx="4" fill="#D4F25C" stroke="#0E1A14" stroke-width="3"/><rect x="30" y="28" width="60" height="72" rx="22" fill="#FFFFFF" stroke="#0E1A14" stroke-width="4"/><rect x="32" y="62" width="56" height="20" fill="#D4F25C"/><g fill="#0E1A14"><rect x="41" y="66" width="2.5" height="12"/><rect x="45.5" y="66" width="1.5" height="12"/><rect x="49" y="66" width="3" height="12"/><rect x="54" y="66" width="1.5" height="12"/><rect x="57.5" y="66" width="2.5" height="12"/></g><g class="p eyes"><circle cx="50" cy="46" r="4.5" fill="#0E1A14"/><circle cx="70" cy="46" r="4.5" fill="#0E1A14"/></g><path d="M52 53 Q60 60 68 53" fill="none" stroke="#0E1A14" stroke-width="3.5" stroke-linecap="round"/><g class="p wave"><path d="M30 66 Q16 58 18 40" fill="none" stroke="#0E1A14" stroke-width="4" stroke-linecap="round"/><circle cx="18" cy="36" r="5" fill="#FFFFFF" stroke="#0E1A14" stroke-width="3.5"/></g><g class="p mlines"><path d="M10 30 Q8 36 10 42 M26 30 Q28 36 26 42" fill="none" stroke="#0E1A14" stroke-width="2.5" stroke-linecap="round" opacity=".55"/></g><path d="M90 72 Q98 78 96 86" fill="none" stroke="#0E1A14" stroke-width="4" stroke-linecap="round"/></g></svg>